[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitsim"
version = "0.1.0"
description = "Educational desktop electrical circuit simulator built with Python, NumPy/SciPy, and PySide6."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
circuitsim = "circuitsim.main:run_demo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"circuitsim" = ["resources/**/*", "resources/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "slow: marks tests taking more than 3 seconds (deselect with '-m \"not slow\"')",
]
